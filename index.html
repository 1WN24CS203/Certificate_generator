<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7fb">
  <meta name="description" content="A universal event survey and certificate portal for organizers and participants.">
  <title>Gatherwell — Event Certificate Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root{--ink:#1e2540;--muted:#7b8299;--line:#e9eaf1;--paper:#fff;--bg:#f6f7fb;--accent:#6658e8;--accent-soft:#f0efff;--green:#299a71}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px}
    button,input,select{font:inherit}
    button{cursor:pointer}
    .topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,56px);position:sticky;top:0;z-index:10}
    .brand{display:flex;align-items:center;gap:11px;font-size:17px;font-weight:750;letter-spacing:-.4px}
    .brand-mark{width:35px;height:35px;border-radius:12px;background:var(--accent);display:grid;place-items:center;color:white;box-shadow:0 6px 15px #6658e833}
    .brand-mark svg{width:19px;height:19px}
    .user-chip{display:flex;align-items:center;gap:9px;color:#717990;font-size:12px}
    .avatar{width:31px;height:31px;border-radius:50%;background:#ebe9ff;color:var(--accent);display:grid;place-items:center;font-weight:700}
    main{max-width:1280px;margin:0 auto;padding:34px clamp(16px,4vw,42px) 68px}
    .eyebrow{font-size:10px;font-weight:750;letter-spacing:1.55px;text-transform:uppercase;color:var(--accent)}
    h1{font-size:28px;line-height:1.18;letter-spacing:-1px;margin:8px 0 7px;font-weight:750}
    h2{font-size:15px;letter-spacing:-.2px;margin:0;font-weight:730}
    h3{font-size:13px;font-weight:700;margin:0}
    .subtle{color:var(--muted);font-size:12px;line-height:1.65}
    .heading-row{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:25px}
    .btn{border:1px solid #e4e5ed;background:#fff;color:#505873;padding:10px 14px;border-radius:9px;font-size:12px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.18s;white-space:nowrap}
    .btn:hover{border-color:#c8c8d8;background:#fafaff;transform:translateY(-1px)}
    .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 5px 12px #6658e825}
    .btn-primary:hover{background:#584bd3;border-color:#584bd3;color:white}
    .btn-quiet{border-color:transparent;background:transparent}
    .btn-danger{color:#c54554}
    .btn:disabled{opacity:.47;cursor:not-allowed;transform:none}
    .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 6px #22294a05}
    .card-pad{padding:21px}
    .studio-grid{display:grid;grid-template-columns:275px minmax(0,1fr);gap:20px;align-items:start}
    .event-sidebar{padding:17px;position:sticky;top:91px}
    .section-label{font-size:10px;font-weight:750;letter-spacing:1.1px;color:#9298aa;text-transform:uppercase;margin:2px 0 13px}
    .event-item{width:100%;display:flex;align-items:center;gap:11px;padding:11px;border:1px solid transparent;background:transparent;text-align:left;border-radius:10px;color:var(--ink);margin:3px 0}
    .event-item:hover{background:#fafaff}
    .event-item.active{background:#f4f3ff;border-color:#eceaff}
    .event-dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:white;font-size:13px;font-weight:700;flex:0 0 auto}
    .event-item strong{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:165px}
    .event-item small{display:block;color:#9298aa;font-size:10px;margin-top:3px}
    .side-add{width:100%;justify-content:flex-start;color:var(--accent);margin-top:8px;border-style:dashed}
    .editor{display:grid;gap:17px;min-width:0}
    .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:19px}
    .card-head .subtle{margin-top:4px}
    .fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .field{display:grid;gap:6px;min-width:0}
    .field.full{grid-column:1/-1}
    label{font-size:11px;font-weight:650;color:#626982}
    input[type=text],input[type=email],input[type=url],input[type=number],input[type=date],input[type=password],select{width:100%;min-width:0;border:1px solid #e5e6ee;border-radius:8px;padding:10px 11px;background:#fff;color:var(--ink);outline:none;transition:.15s}
    input:focus,select:focus{border-color:#a9a0ff;box-shadow:0 0 0 3px #6658e812}
    input::placeholder{color:#b0b4c2}
    .input-note{font-size:10px;color:#9a9fb0;line-height:1.5}
    .accent-input{height:39px;width:52px;padding:3px;border:1px solid var(--line);border-radius:8px;background:#fff}
    .color-row{display:flex;align-items:center;gap:9px}
    .field-inline{display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center}
    .hr{height:1px;background:#f0f0f5;margin:18px 0}
    .template-drop{min-height:77px;border:1px dashed #d8d9e5;background:#fbfbfe;border-radius:10px;display:flex;align-items:center;gap:12px;padding:12px;cursor:pointer}
    .template-drop:hover{border-color:#9c92ff;background:#f9f8ff}
    .upload-symbol{width:37px;height:37px;border-radius:10px;background:#f0efff;color:var(--accent);display:grid;place-items:center;font-size:17px;flex-shrink:0}
    .template-drop strong{font-size:11px;display:block}
    .template-drop small{font-size:10px;color:#969bad;display:block;margin-top:4px}
    .toggle-row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:4px 0}
    .toggle{position:relative;width:35px;height:20px;flex-shrink:0}
    .toggle input{opacity:0;width:0;height:0}
    .toggle span{position:absolute;inset:0;background:#d9dbe5;border-radius:20px;transition:.2s}
    .toggle span:before{content:"";position:absolute;width:14px;height:14px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}
    .toggle input:checked+span{background:var(--accent)}
    .toggle input:checked+span:before{transform:translateX(15px)}
    .link-row{display:flex;gap:8px}
    .link-row input{min-width:0}
    .gate-settings{padding:14px;border-radius:10px;background:#fafaff;border:1px solid #efeff8;margin-top:12px}
    .radio-group{display:flex;flex-wrap:wrap;gap:8px}
    .radio-choice{position:relative}
    .radio-choice input{position:absolute;opacity:0}
    .radio-choice span{display:inline-flex;padding:8px 10px;border:1px solid #e7e7ef;background:#fff;border-radius:8px;font-size:10px;color:#747b91;cursor:pointer}
    .radio-choice input:checked+span{border-color:#aaa2ff;color:var(--accent);background:#f4f3ff}
    .design-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(215px,.75fr);gap:18px}
    .canvas-wrap{background:#f0f1f6;padding:12px;border-radius:11px}
    canvas#designer{width:100%;height:auto;display:block;border-radius:5px;cursor:crosshair;box-shadow:0 4px 18px #252a4514}
    .canvas-hint{font-size:10px;color:#979caf;margin-top:9px;display:flex;justify-content:space-between;gap:8px}
    .design-controls{display:grid;align-content:start;gap:12px}
    .range-row{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}
    input[type=range]{width:100%;accent-color:var(--accent)}
    output{font-size:10px;color:#9298aa;min-width:30px;text-align:right}
    .design-control{display:grid;gap:6px}
    .small-select{padding:8px 9px!important;font-size:11px}
    .mini-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .mini-fields input[type=number]{padding:8px 9px}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
    .stat{padding:15px 17px}
    .stat small{color:#9197aa;font-size:10px}
    .stat strong{font-size:21px;display:block;margin-top:5px;letter-spacing:-.5px}
    .table-wrap{overflow:auto}
    table{width:100%;border-collapse:collapse;min-width:700px}
    th{text-align:left;color:#969bad;text-transform:uppercase;font-size:9px;letter-spacing:.8px;font-weight:700;padding:11px 12px;border-bottom:1px solid #eeeef4}
    td{padding:12px;font-size:11px;border-bottom:1px solid #f1f1f5;color:#535a72;white-space:nowrap}
    td:first-child{color:var(--ink);font-weight:650}
    .id-pill{font-family:ui-monospace,monospace;font-size:10px;color:#6558d9;background:#f2f1ff;border-radius:5px;padding:4px 6px}
    .empty{text-align:center;padding:30px 12px;color:#989dae;font-size:11px}
    .share-panel{display:flex;align-items:center;gap:9px;margin-top:13px}
    .share-panel input{background:#fafaff;font-size:10px}
    .share-panel .btn{flex-shrink:0}
    .participant-wrap{max-width:920px;margin:0 auto}
    .steps{display:grid;grid-template-columns:repeat(3,1fr);margin:25px 0 22px;position:relative}
    .steps:before{content:"";height:1px;background:#e4e5ed;position:absolute;top:15px;left:16.5%;right:16.5%}
    .step{position:relative;display:grid;justify-items:center;gap:7px;text-align:center;color:#a1a5b4;font-size:10px}
    .step-number{width:31px;height:31px;border-radius:50%;background:#fff;border:1px solid #e3e4ed;display:grid;place-items:center;color:#969bad;font-size:11px;font-weight:700;z-index:1}
    .step.active{color:var(--accent);font-weight:700}
    .step.active .step-number{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 10px #6658e833}
    .step.done{color:#2e9b76;font-weight:650}
    .step.done .step-number{background:#e8f7f0;color:#299a71;border-color:#c5eadb}
    .participant-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(280px,.95fr);gap:17px;align-items:start}
    .event-banner{padding:19px 21px;display:flex;gap:14px;align-items:center;margin-bottom:16px}
    .event-icon{width:43px;height:43px;border-radius:13px;display:grid;place-items:center;color:white;font-size:19px;flex:0 0 auto}
    .event-banner h2{font-size:16px}
    .event-banner p{margin:4px 0 0;color:#8b91a4;font-size:11px}
    .gate-card{padding:21px}
    .gate-state{padding:14px;border-radius:10px;background:#fffaf0;border:1px solid #f5ead1;display:flex;gap:11px;margin:16px 0}
    .gate-state.unlocked{background:#effaf5;border-color:#d6f0e2}
    .gate-state-icon{width:29px;height:29px;border-radius:9px;background:#fff1d2;color:#b78325;display:grid;place-items:center;flex-shrink:0}
    .gate-state.unlocked .gate-state-icon{background:#dcf4e8;color:#25865f}
    .gate-state strong{font-size:11px;display:block;margin:1px 0 4px}
    .gate-state p{margin:0;color:#8d91a0;font-size:10px;line-height:1.55}
    .survey-actions{display:grid;gap:10px}
    .survey-open{width:100%;padding:12px}
    .timer-hint{font-size:10px;color:#9298aa;text-align:center;min-height:15px}
    .confirm-row{display:flex;align-items:flex-start;gap:9px;font-size:10px;color:#70768b;line-height:1.5}
    .confirm-row input{accent-color:var(--accent);margin-top:2px}
    .code-form{display:grid;grid-template-columns:1fr auto;gap:8px}
    .lock-note{font-size:10px;color:#999eaf;display:flex;align-items:center;gap:6px;margin-top:14px}
    .certificate-preview{padding:16px}
    #participant-preview{width:100%;height:auto;border-radius:6px;box-shadow:0 3px 12px #252a4514;display:block}
    .certificate-caption{display:flex;align-items:center;justify-content:space-between;gap:9px;margin:0 0 12px}
    .preview-chip{font-size:9px;padding:5px 7px;color:#398264;background:#eaf7f0;border-radius:20px}
    .claim-card{padding:21px}
    .claim-form{display:grid;gap:12px}
    .certificate-actions{display:flex;gap:9px;margin-top:13px;flex-wrap:wrap}
    .certificate-actions .btn{flex:1}
    .verification{font-size:10px;color:#888ea1;margin-top:12px;display:flex;align-items:center;gap:6px}
    .toast-container{position:fixed;right:20px;bottom:20px;z-index:50;display:grid;gap:8px}
    .toast{background:#222841;color:white;border-radius:10px;padding:12px 16px;box-shadow:0 8px 24px #15192b25;font-size:12px;max-width:min(360px,calc(100vw - 32px));animation:toastIn .2s ease-out}
    .toast.error{background:#a83d4b}
    .toast.success{background:#267956}
    @keyframes toastIn{from{transform:translateY(7px);opacity:0}to{transform:translateY(0);opacity:1}}
    .locked-banner{text-align:center;padding:50px 24px}
    .locked-banner .lock-icon{width:54px;height:54px;border-radius:17px;background:#f0efff;color:var(--accent);display:grid;place-items:center;margin:0 auto 15px}
    .locked-banner h2{font-size:18px;margin-bottom:7px}
    .locked-banner p{max-width:390px;margin:0 auto 18px}
    .portal-note{font-size:10px;color:#a1a6b5;text-align:center;margin-top:15px;line-height:1.5}
    .hidden{display:none!important}
    @media(max-width:850px){.studio-grid{grid-template-columns:220px minmax(0,1fr)}.design-grid{grid-template-columns:1fr}.design-controls{grid-template-columns:1fr 1fr}.design-controls .design-control:first-child{grid-column:1/-1}.participant-grid{grid-template-columns:1fr}.event-sidebar{top:84px}}
    @media(max-width:620px){.topbar{height:63px;padding:0 14px}.brand{font-size:15px}.brand-mark{width:32px;height:32px}.user-chip span{display:none}main{padding-top:25px}.heading-row{align-items:flex-start;flex-direction:column;margin-bottom:18px}.heading-row .btn{align-self:flex-start}.studio-grid{grid-template-columns:1fr;gap:13px}.event-sidebar{position:static;padding:13px}.event-list{display:flex;overflow:auto;gap:5px}.event-item{min-width:185px;width:auto;margin:0}.event-item strong{max-width:130px}.side-add{width:auto;margin:8px 0 0}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.card-pad{padding:16px}.design-controls{grid-template-columns:1fr 1fr}.stats{gap:7px}.stat{padding:12px}.stat strong{font-size:18px}.share-panel{flex-wrap:wrap}.share-panel input{width:100%}.share-panel .btn{flex:1}.steps{margin:22px 0 18px}.step{font-size:9px}.step-number{width:29px;height:29px}.steps:before{top:14px}.event-banner{padding:15px}.certificate-preview{padding:12px}.gate-card,.claim-card{padding:16px}.certificate-actions{flex-direction:column}.participant-wrap h1{font-size:25px}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 3.8 7.5 12 12l8.2-4.5L12 3Z"/><path d="m3.8 12 8.2 4.5 8.2-4.5M3.8 16.5 12 21l8.2-4.5"/></svg></div>
      <span>gatherwell<span style="color:#a7a4c4">.</span></span>
    </div>
    <div class="user-chip"><span id="portal-role">Organizer workspace</span><div class="avatar" id="portal-avatar">O</div></div>
  </header>
  <main id="app"></main>
  <div class="toast-container" id="toasts" aria-live="polite"></div>
  <input id="template-file" type="file" accept="image/png,image/jpeg,image/webp" class="hidden">
  <script>
  (() => {
    "use strict";
    const STORE_KEY = "gatherwell_events_v1";
    const app = document.getElementById("app");
    const params = new URLSearchParams(location.search);
    const lockedParticipant = params.get("mode") === "participant";
    const mode = lockedParticipant ? "participant" : "studio";
    let events = [];
    let selectedId = params.get("event") || "";
    let gateTimer = null;
    let remaining = 0;
    let surveyOpened = false;
    let surveyConfirmed = false;
    let codeAccepted = false;
    let certificateClaim = null;
    let previewName = "Your name here";

    const makeId = () => "evt_" + Math.random().toString(36).slice(2, 9);
    const defaults = () => ({
      id: makeId(), name: "Design Futures Summit", organizer: "Northstar Collective",
      date: new Date().toISOString().slice(0, 10), accent: "#6658e8", surveyUrl: "",
      gate: "external", dwell: 15, secret: "", templateData: "", font: "serif",
      fontSize: 43, bold: true, textColor: "#26304b", x: 50, y: 58, stamp: true,
      participants: []
    });
    const persist = () => {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(events)); return true; }
      catch (err) { console.error("Could not save event data to localStorage.", err); toast("Could not save. The uploaded image may exceed your browser's storage limit.", "error"); return false; }
    };
    const loadEvents = () => {
      try {
        const saved = localStorage.getItem(STORE_KEY);
        events = saved ? JSON.parse(saved) : [];
        if (!Array.isArray(events)) throw new Error("Saved event data has an invalid format.");
      } catch (err) {
        console.error("Could not load event data.", err);
        events = [];
        toast("Saved event data could not be read. Create a new event to continue.", "error");
      }
      if (!events.length) {
        const sample = defaults();
        events.push(sample);
        persist();
      }
      if (!lockedParticipant && (!selectedId || !events.some(e => e.id === selectedId))) selectedId = events[0]?.id || "";
    };
    const current = () => events.find(e => e.id === selectedId) || null;
    const esc = value => String(value ?? "").replace(/[&<>"']/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[ch]));
    const toast = (message, type = "") => {
      const el = document.createElement("div");
      el.className = "toast " + type;
      el.textContent = message;
      document.getElementById("toasts").appendChild(el);
      setTimeout(() => el.remove(), 3500);
    };
    const dateLabel = value => {
      if (!value) return "Date not set";
      const date = new Date(value + "T12:00:00");
      return Number.isNaN(date.getTime()) ? value : date.toLocaleDateString(undefined, { month:"short", day:"numeric", year:"numeric" });
    };
    const updateEvent = (key, value, redraw = false) => {
      const e = current();
      if (!e) return;
      e[key] = value;
      persist();
      if (redraw) {
        render();
        return;
      }
      if (key === "name" || key === "organizer" || key === "date" || key === "accent") {
        const name = document.querySelector("[data-live=name]");
        if (name && key === "name") name.textContent = value || "Untitled event";
        const org = document.querySelector("[data-live=organizer]");
        if (org && key === "organizer") org.textContent = value || "Organizer";
        const icon = document.querySelector(".event-icon");
        if (icon && key === "accent") icon.style.background = value;
        const dot = document.querySelector(".event-item.active .event-dot");
        if (dot && key === "accent") dot.style.background = value;
      }
      if (["font","fontSize","bold","textColor","x","y","stamp"].includes(key)) drawDesigner();
    };
    const sampleTemplate = (canvas, event) => {
      const ctx = canvas.getContext("2d");
      const w = canvas.width, h = canvas.height;
      ctx.fillStyle = "#fbf8ef"; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "#f4efdf"; ctx.fillRect(0, 0, w, h * .085);
      ctx.fillStyle = "#f4efdf"; ctx.fillRect(0, h * .915, w, h * .085);
      const pad = Math.min(w, h) * .075;
      ctx.strokeStyle = event.accent || "#6658e8"; ctx.lineWidth = Math.max(2, w * .004);
      ctx.strokeRect(pad, pad, w - pad * 2, h - pad * 2);
      ctx.lineWidth = Math.max(1, w * .0014);
      ctx.strokeStyle = "#cfbea0";
      ctx.strokeRect(pad + w * .016, pad + w * .016, w - 2 * (pad + w * .016), h - 2 * (pad + w * .016));
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillStyle = event.accent || "#6658e8";
      ctx.font = `700 ${Math.round(w * .016)}px ui-sans-serif, system-ui`;
      ctx.fillText((event.organizer || "YOUR ORGANIZATION").toUpperCase(), w / 2, h * .205);
      ctx.fillStyle = "#3b4050"; ctx.font = `500 ${Math.round(w * .019)}px Georgia, serif`;
      ctx.fillText("CERTIFICATE OF", w / 2, h * .32);
      ctx.fillStyle = event.accent || "#6658e8"; ctx.font = `700 ${Math.round(w * .045)}px Georgia, serif`;
      ctx.fillText("APPRECIATION", w / 2, h * .395);
      ctx.fillStyle = "#727586"; ctx.font = `400 ${Math.round(w * .014)}px ui-sans-serif, system-ui`;
      ctx.fillText("is proudly presented to", w / 2, h * .49);
      ctx.fillStyle = "#253047"; ctx.font = `italic ${Math.round(w * .033)}px Georgia, serif`;
      ctx.fillText("Your name here", w / 2, h * .585);
      ctx.strokeStyle = "#bdb49f"; ctx.lineWidth = Math.max(1, w * .001);
      ctx.beginPath(); ctx.moveTo(w * .29, h * .625); ctx.lineTo(w * .71, h * .625); ctx.stroke();
      ctx.fillStyle = "#666b79"; ctx.font = `400 ${Math.round(w * .012)}px ui-sans-serif, system-ui`;
      ctx.fillText(`for participating in ${event.name || "our event"}`, w / 2, h * .69);
      ctx.fillText(dateLabel(event.date), w / 2, h * .745);
      ctx.fillStyle = event.accent || "#6658e8";
      ctx.beginPath(); ctx.arc(w * .5, h * .845, w * .025, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.font = `700 ${Math.round(w * .015)}px Georgia, serif`;
      ctx.fillText("✦", w / 2, h * .845);
      ctx.fillStyle = "#747988"; ctx.font = `500 ${Math.round(w * .009)}px ui-sans-serif, system-ui`;
      ctx.fillText("EVENT ORGANIZER", w * .5, h * .885);
    };

          <div class="eyebrow">Participant portal</div><h1>One last step to your certificate.</h1><div class="subtle">Share your feedback, then claim your personalized certificate of participation.</div>
          <div class="steps"><div class="step done"><span class="step-number">✓</span><span>Event details</span></div><div id="step-2" class="step ${complete?"done":"active"}"><span class="step-number">${complete?"✓":"2"}</span><span>Survey verification</span></div><div id="step-3" class="step ${complete?"active":""}"><span class="step-number">3</span><span>Your certificate</span></div></div>
          <div class="event-banner card"><div class="event-icon" style="background:${esc(event.accent||"#6658e8")}">✦</div><div><h2 data-live="name">${esc(event.name||"Untitled event")}</h2><p><span data-live="organizer">${esc(event.organizer||"Organizer")}</span> &nbsp;·&nbsp; ${esc(dateLabel(event.date))}</p></div></div>
          <div class="participant-grid">
            <div>
              <section class="card gate-card">
                <h2>01 &nbsp; Complete the post-event survey</h2><div class="subtle" style="margin-top:5px">Your feedback helps this event grow.</div>
                <div id="gate-status" class="gate-state ${complete?"unlocked":""}"><div class="gate-state-icon">${complete?"✓":"⌑"}</div><div><strong>${complete?"Survey verification complete":"Certificate access is locked"}</strong><p>${complete?"Your certificate form is ready.":"Complete the survey verification steps below to unlock your certificate."}</p></div></div>
                <div class="survey-actions">
                  ${event.gate!=="code"?`<button class="btn btn-primary survey-open" id="open-survey">↗ &nbsp; Open post-event survey form</button><div class="timer-hint" id="timer-hint">${surveyOpened?remaining>0?`You can continue in ${remaining} seconds…`:"Timer complete — confirm your survey submission.":"Open the survey to start your verification."}</div><label class="confirm-row"><input id="survey-confirm" type="checkbox" ${surveyConfirmed?"checked":""} ${!surveyOpened||remaining>0?"disabled":""}><span>I have completed and submitted the survey.</span></label>`:""}
                  ${event.gate!=="external"?`<div class="field"><label for="completion-code">Secret completion code</label><div class="code-form"><input id="completion-code" type="password" placeholder="Enter the code from the survey" autocomplete="off"><button id="verify-code" class="btn">Verify code</button></div></div>`:""}
                </div>
                <div class="lock-note">⌑ &nbsp; ${event.gate==="external"?"Survey link, timer, and confirmation required":event.gate==="code"?"A valid event completion code is required":"Survey, timer, confirmation, and code are required"}</div>
              </section>
              <div id="claim-area" class="card" style="margin-top:16px">${complete?certificateClaim?claimSuccess():claimForm():lockedForm()}</div>
            </div>
            <section class="card certificate-preview">
              <div class="certificate-caption"><div><h3>Certificate preview</h3><div class="subtle" style="font-size:10px;margin-top:3px">Personalized after verification</div></div><span class="preview-chip">High resolution</span></div>
              <canvas id="participant-preview" width="1000" height="688"></canvas>
              ${certificateClaim?`<div class="verification">◈ &nbsp; Verification ID: <span class="id-pill">${esc(certificateClaim.id)}</span></div><div class="certificate-actions"><button class="btn btn-primary" id="download-png">↓&nbsp; Download PNG</button><button class="btn" id="download-pdf">↓&nbsp; Print-ready PDF</button></div>`:""}
            </section>
          </div>
          <div class="portal-note">Your certificate is generated in this browser. Your event organizer stores participant logs on their device. &nbsp;·&nbsp; Keep your verification ID for reference.</div>
        </div>`;
      const canvas=document.getElementById("participant-preview");
      if(certificateClaim)await paintParticipantPreview(canvas,event,certificateClaim.name,certificateClaim.id,certificateClaim.issued);
      else drawCertificate(canvas,event,"Your name here","",new Date().toLocaleDateString(),false);
      const open=document.getElementById("open-survey");
      if(open)open.onclick=()=>openSurvey(false);
      const confirm=document.getElementById("survey-confirm");
      if(confirm)confirm.onchange=()=>{surveyConfirmed=confirm.checked;updateGateUI();};
      const verify=document.getElementById("verify-code");
      if(verify)verify.onclick=()=>{
        const input=document.getElementById("completion-code");
        if(!event.secret){toast("The organizer has not configured a completion code yet.","error");return;}
        if(String(input.value).trim()===String(event.secret)){codeAccepted=true;toast("Completion code accepted.","success");updateGateUI();}
        else{codeAccepted=false;toast("That code did not match. Please check and try again.","error");}
      };
      bindClaimForm();
      const png=document.getElementById("download-png"),pdf=document.getElementById("download-pdf");
      if(png)png.onclick=()=>downloadCertificate("png");
      if(pdf)pdf.onclick=()=>downloadCertificate("pdf");
      updateGateUI();
    };
    const paintParticipantPreview = async (canvas,event,name,id,issued) => {
      const result=await getParticipantCanvas(event,name,id,issued);
      canvas.width=1000;canvas.height=688;
      const ctx=canvas.getContext("2d");
      ctx.drawImage(result,0,0,canvas.width,canvas.height);
    };
    const claimSuccess=()=>`<div class="claim-card"><div class="gate-state unlocked" style="margin:0"><div class="gate-state-icon">✓</div><div><strong>Certificate ready</strong><p>Your personalized certificate is ready to download.</p></div></div></div>`;
    const downloadCertificate = async format => {
      const event=current(),claim=certificateClaim;
      if(!event||!claim)return;
      try{
        const canvas=await getParticipantCanvas(event,claim.name,claim.id,claim.issued);
        const filename=`${claim.name.trim().replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,"").toLowerCase()||"certificate"}-${claim.id}`;
        if(format==="png"){
          const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error("PNG export failed.")),"image/png"));
          const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=filename+".png";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
        }else{
          if(!window.jspdf?.jsPDF)throw new Error("The PDF library could not be loaded. Check your internet connection and try again.");
          const orientation=canvas.width>=canvas.height?"landscape":"portrait";
          const pdf=new window.jspdf.jsPDF({orientation,unit:"px",format:[canvas.width,canvas.height],hotfixes:["px_scaling"]});
          pdf.addImage(canvas.toDataURL("image/png"),"PNG",0,0,canvas.width,canvas.height,undefined,"FAST");
          pdf.save(filename+".pdf");
        }
        toast(`Certificate ${format.toUpperCase()} downloaded.`,"success");
      }catch(err){console.error("Certificate download failed.",err);toast(err.message||"Certificate download failed.","error");}
    };
    const bindGlobal = () => {
      const input=document.getElementById("template-file");
      input.onchange=async e=>{
        const file=e.target.files?.[0];if(!file)return;
        if(!["image/png","image/jpeg","image/webp"].includes(file.type)){toast("Choose a PNG, JPEG, or WebP image.","error");input.value="";return;}
        if(file.size>3*1024*1024){toast("Please choose an image smaller than 3 MB so it can be stored in this browser.","error");input.value="";return;}
        const reader=new FileReader();
        reader.onerror=()=>{console.error("Failed to read certificate image.");toast("Could not read the selected image.","error");};
        reader.onload=()=>{
          const image=new Image();
          image.onerror=()=>toast("The selected file is not a valid image.","error");
          image.onload=()=>{const event=current();if(!event)return;event.templateData=String(reader.result);persist();render();toast(`Certificate template uploaded (${image.naturalWidth} × ${image.naturalHeight}).`,"success");};
          image.src=String(reader.result);
        };
        reader.readAsDataURL(file);
      };
    };
    const render = () => {
      document.documentElement.style.setProperty("--accent",current()?.accent||"#6658e8");
      document.getElementById("portal-role").textContent=lockedParticipant?"Participant portal":"Organizer workspace";
      document.getElementById("portal-avatar").textContent=lockedParticipant?"P":"O";
      if(mode==="participant")renderParticipant();else renderStudio();
      bindGlobal();
    };
    loadEvents();
    render();
  })();
  </script>
</body>
</html>
